version: '3.8'

services:
  # PHP-FPM Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./backend/storage:/app/backend/storage
      - ./backend/bootstrap/cache:/app/backend/bootstrap/cache
    ports:
      - "9000:9000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - laravel_network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "php-fpm"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/app/backend
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx-logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - laravel_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Redis Cache Service (Optional but recommended)
  redis:
    image: redis:alpine
    container_name: laravel_redis
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis-data:/data
    networks:
      - laravel_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Postgres Database Service
  postgres:
    image: postgres:15-alpine
    container_name: laravel_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    networks:
      - laravel_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  laravel_network:
    driver: bridge

volumes:
  redis_data:
